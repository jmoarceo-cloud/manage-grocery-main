<VirtualHost *:80>
    # Runs behind the shared Caddy on vps-prod-01, which terminates TLS.
    # A scheme in ServerName + UseCanonicalName makes Apache build https://
    # URLs for its own redirects (the .htaccess .php-stripping 301s).
    ServerName https://manage-grocery.digitalapps.tech
    UseCanonicalName On

    DocumentRoot /var/www/html
    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Real client IP from Caddy. The app reads REMOTE_ADDR for login
    # throttling, and kiosk.php is restricted to private IPs — without this
    # every request would appear to come from Caddy's private address.
    RemoteIPHeader X-Forwarded-For
    RemoteIPInternalProxy 172.20.0.0/24

    SetEnvIf X-Forwarded-Proto "^https$" HTTPS=on

    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>
